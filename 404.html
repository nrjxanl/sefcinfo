<body oncontextmenu="return false">

    <header glass="true">
        <div><img src="/files/menu.svg" onclick="menu()"></div>
        <div><img src="/files/sefcinfo.svg"></div>
    </header>

    <div id="skeletonMobile"></div>
    <div id="skeletonPC"></div>

    <div id="actualContents">
        <div id="error404"></div>
    </div>

    <script src="/script.js"></script>
    <script type="module">
        import { loadData } from '/firebase.js';

        beforeLoading();

        function render404() {
            $('#error404').html(
                `<p style="padding: 0 0 10px 0; margin: 0; color: #000060; font-size: 120px; font-weight: 900; line-height: 1;">404</p>` +
                `<p style="padding: 10px 0; margin: 0; color: #000060; font-size: 16px; font-weight: 300;">페이지가 삭제되었거나 주소가 잘못되어<br>페이지를 찾을 수 없어요</p>` +
                `<p style="margin-top: 10px;"><a href="/" style="color: #000060; font-size: 14px; font-weight: 600; text-decoration: none; padding: 4px 12px; border: 2px solid #000060; border-radius: 20px;">홈 화면으로 가기</a></p>`
            );
        }

        async function resolveShortUrl() {
            const seg = window.location.pathname.replace(/\/+$/, '').split('/').pop() || '';

            try {
                if (/^\d{9}$/.test(seg)) {
                    const teamPath = seg[8] === '0' ? 'dataA' : (seg[8] === '8' ? 'dataU18' : (seg[8] === '5' ? 'dataU15' : null));
                    if (teamPath) {
                        const data = await loadData(teamPath);
                        if (data && data[seg] !== undefined) {
                            window.location.replace('/match?' + seg);
                            return;
                        }
                    }
                } else if (/^\d{8}$/.test(seg)) {
                    for (const playerPath of ['playerA', 'playerU18', 'playerU15']) {
                        const players = await loadData(playerPath);
                        if (players && players[seg] !== undefined) {
                            window.location.replace('/player?' + seg);
                            return;
                        }
                    }
                }
            } catch (error) {
                console.error('404 단축 URL 조회 실패:', error);
            }

            render404();
            afterLoading();
        }

        resolveShortUrl();
    </script>

</body>
